version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: event_manager_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: event_manager
      MYSQL_USER: eventuser
      MYSQL_PASSWORD: eventpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./event_managerVf.sql:/docker-entrypoint-initdb.d/event_managerVf.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: event_manager_app
    environment:
      DATABASE_URL: mysql://eventuser:eventpass@mysql:3306/event_manager
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
